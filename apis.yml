description: OpenDurian is a Bangkok, Thailand based educational technology company delivering hybrid
  (online plus offline) learning and test preparation. Its platform offers exam-prep courses for TOEIC,
  IELTS, TOEFL, TCAS and Thai civil-service exams, language instruction in English, Chinese and Japanese,
  secondary-school mathematics and science courses, an online bookstore, free English-proficiency
  assessment tools, and extensive practice-test question banks. The company reports reach in the millions
  of annual users across its learning ecosystem. It is a consumer-facing edtech product; as of this
  enrichment pass no public developer API, developer portal, or API documentation was found.
